# Scenario schema v4. See https://github.com/k-p2p-lab/kpl-v3/wiki/Worker-Attacks
version: 4
name: Covert flash
seed: 42
onExit: drain
profiles:
  honest:
    type: worker
    gossipsub:
      topics:
      - blocks
      - control
  attacker:
    type: worker
    gossipsub:
      topics:
      - blocks
      - control
      allowPublish: false
    sink:
      enabled: false
      probability: 1
phases:
- action: join
  group: honest
  role: worker
  profile: honest
  count: 8
  parallel: true
- action: join
  group: attackers
  role: worker
  profile: attacker
  count: 2
  parallel: true
- action: wait-ready
  timeout: 2m
- action: wait
  duration: 10s
- action: schedule
  group: attackers
  job: attack-window
  await: false
  schedule:
    reference: phase-start
    changes:
    - after: 30s
      set:
        sink:
          enabled: true
    - after: 90s
      set:
        sink:
          enabled: false
- action: publish
  group: honest
  topic: blocks
  count: 120
  payloadSize: 1024
  interval:
    model: fixed
    value: 1s
- action: wait-jobs
  jobs:
  - attack-window
  timeout: 2m
- action: wait
  duration: 10s
- action: stop-all
