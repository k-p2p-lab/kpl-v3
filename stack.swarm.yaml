version: "3.8"

# Deploy with scripts/swarm.sh. See docs/swarm.md.
# scripts/swarm.sh resolves a configured tag to one digest for this deployment.
services:
  controller:
    image: "${KPL_IMAGE:?Set KPL_IMAGE to a registry image tag or digest}"
    command: [controller, --listen, ':8080', --data-dir, /var/lib/kpl/data]
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:?Set KPL_API_TOKEN}"
      KPL_CONTROLLER_METRICS_URL: "${KPL_CONTROLLER_METRICS_URL:?Deploy with scripts/swarm.sh}"
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:-9090}"
      GRAFANA_PORT: "${GRAFANA_PORT:-3000}"
    volumes: [controller-data:/var/lib/kpl/data]
    networks: [peers, monitoring]
    ports:
      - target: 8080
        published: ${KPL_HTTP_PORT:-8080}
        protocol: tcp
        mode: host
    stop_grace_period: 10m
    deploy:
      labels:
        io.kpl.application: kp2plab-v3
      replicas: 1
      placement:
        constraints: ['node.platform.os == linux', 'node.id == ${KPL_CONTROL_NODE_ID:?Set the persistent control node ID}']
      update_config: {parallelism: 1, order: stop-first}
      rollback_config: {parallelism: 1, order: stop-first}
      restart_policy: {condition: any, delay: 5s}

  agent:
    image: "${KPL_IMAGE:?Set KPL_IMAGE to a registry image tag or digest}"
    user: '0:0'
    entrypoint: [sh, /usr/local/bin/kpl-swarm-agent.sh]
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:?Set KPL_API_TOKEN}"
      KPL_SWARM_TASK_NAME: '{{.Task.Name}}'
      KPL_SWARM_SERVICE_NAME: '{{.Service.Name}}'
      KPL_SWARM_NODE_ID: '{{.Node.ID}}'
      KPL_SWARM_NODE_HOSTNAME: '{{.Node.Hostname}}'
      KPL_PEER_NETWORK: "${KPL_PEER_NETWORK:-kpl-swarm-peers}"
      KPL_AGENT_CAPACITY: "${KPL_AGENT_CAPACITY:-20}"
      KPL_AGENT_METRICS_PORT: "${KPL_AGENT_METRICS_PORT:-9091}"
      KPL_CONTROLLER_URL: http://${KPL_STACK_NAME:-kpl}_controller:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [peers, monitoring]
    ports:
      - target: 9091
        published: ${KPL_AGENT_METRICS_PORT:-9091}
        protocol: tcp
        mode: host
    stop_grace_period: 4m
    deploy:
      labels:
        io.kpl.application: kp2plab-v3
      mode: global
      endpoint_mode: dnsrr
      placement:
        constraints: ['node.platform.os == linux', 'node.labels.kpl.${KPL_STACK_NAME:-kpl}.agent == true']
      update_config: {parallelism: 1, order: stop-first}
      rollback_config: {parallelism: 1, order: stop-first}
      restart_policy: {condition: any, delay: 5s}

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=${KPL_PROMETHEUS_EXTERNAL_URL:?Deploy with scripts/swarm.sh}
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    configs:
      - source: prometheus-public-targets-v3
        target: /etc/prometheus/prometheus.yml
    volumes: [prometheus-data:/prometheus]
    networks: [monitoring]
    ports:
      - {target: 9090, published: '${PROMETHEUS_PORT:-9090}', protocol: tcp, mode: host}
    deploy:
      labels:
        io.kpl.application: kp2plab-v3
      replicas: 1
      placement:
        constraints: ['node.platform.os == linux', 'node.id == ${KPL_CONTROL_NODE_ID:?Set the persistent control node ID}']
      update_config: {parallelism: 1, order: stop-first}

  grafana:
    image: grafana/grafana:13.2.1
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        # Existing volumes retain the original admin account (ID 1).
        # Apply the configured password before each server start.
        if [ -s "${GF_PATHS_DATA}/grafana.db" ]; then
          : "${GF_SECURITY_ADMIN_PASSWORD:?Grafana administrator password is required}"
          printf '%s\n' "${GF_SECURITY_ADMIN_PASSWORD}" |
            grafana cli --homepath "${GF_PATHS_HOME}" \
              --config "${GF_PATHS_CONFIG}" \
              --configOverrides "cfg:default.paths.data=${GF_PATHS_DATA}" \
              admin reset-admin-password --user-id 1 --password-from-stdin
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_DEFAULT_LANGUAGE: en-US
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_DATABASE_WAL: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kpl-experiments.json
    configs:
      - {source: grafana-datasource, target: /etc/grafana/provisioning/datasources/prometheus.yaml}
      - {source: grafana-provider, target: /etc/grafana/provisioning/dashboards/kpl.yaml}
      - {source: grafana-dashboard-bandwidth-v7, target: /var/lib/grafana/dashboards/kpl-experiments.json}
    volumes: [grafana-data:/var/lib/grafana]
    networks: [monitoring]
    ports:
      - {target: 3000, published: '${GRAFANA_PORT:-3000}', protocol: tcp, mode: host}
    deploy:
      labels:
        io.kpl.application: kp2plab-v3
      replicas: 1
      placement:
        constraints: ['node.platform.os == linux', 'node.id == ${KPL_CONTROL_NODE_ID:?Set the persistent control node ID}']
      update_config: {parallelism: 1, order: stop-first}

networks:
  peers:
    external: true
    name: "${KPL_PEER_NETWORK:-kpl-swarm-peers}"
  monitoring:
    driver: overlay

volumes:
  controller-data:
  prometheus-data:
  grafana-data:

configs:
  prometheus-public-targets-v3:
    file: ./monitoring/prometheus/swarm.yml
  grafana-datasource:
    file: ./monitoring/grafana/provisioning/datasources/prometheus.yaml
  grafana-provider:
    file: ./monitoring/grafana/provisioning/dashboards/kpl.yaml
  grafana-dashboard-bandwidth-v7:
    file: ./monitoring/grafana/dashboards/kpl-experiments.json
