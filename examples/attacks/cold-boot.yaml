# Scenario schema v4. See https://github.com/k-p2p-lab/kpl-v3/wiki/Worker-Attacks
version: 4
name: Cold boot
seed: 42
onExit: drain
profiles:
  honest:
    type: worker
    gossipsub:
      topics:
      - blocks
      - control
  attacker:
    type: worker
    gossipsub:
      topics:
      - blocks
      - control
      allowPublish: false
    connectionAttack:
      enabled: true
      targets:
        groups:
        - honest
      targetConnections: 8
      retryInterval: 1s
    sink:
      enabled: true
      probability: 1
    graftFlood:
      enabled: true
      topics:
      - blocks
      targets:
        groups:
        - honest
      interval: 1s
      graftsPerPeer: 1
      respectBackoff: false
phases:
- action: join
  group: honest
  role: worker
  profile: honest
  count: 8
  parallel: true
  job: honest-joins
  await: false
- action: join
  group: attackers
  role: worker
  profile: attacker
  count: 2
  parallel: true
  job: attacker-joins
  await: false
- action: wait-jobs
  jobs:
  - honest-joins
  - attacker-joins
  timeout: 3m
- action: wait-ready
  timeout: 2m
- action: wait
  duration: 10s
- action: publish
  group: honest
  topic: blocks
  count: 120
  payloadSize: 1024
  interval:
    model: fixed
    value: 1s
- action: wait
  duration: 10s
- action: stop-all
