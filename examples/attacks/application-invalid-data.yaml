# Scenario schema v4. See https://github.com/k-p2p-lab/kpl-v3/wiki/Worker-Attacks
version: 4
name: Application invalid data
seed: 42
onExit: drain
profiles:
  honest:
    type: worker
    gossipsub:
      topics:
      - blocks
      - control
      topicOptions:
        blocks:
          validator:
            format: envelope
  attacker:
    type: worker
    gossipsub:
      topics:
      - blocks
      - control
      allowPublish: true
phases:
- action: join
  group: honest
  role: worker
  profile: honest
  count: 8
  parallel: true
- action: join
  group: attackers
  role: worker
  profile: attacker
  count: 2
  parallel: true
- action: wait-ready
  timeout: 2m
- action: wait
  duration: 10s
- action: publish
  group: attackers
  topic: blocks
  # 2 publishers x 60 rounds = 120 publication attempts.
  count: 2
  repeat: 60
  payloadSize: 1
  interval:
    model: fixed
    value: 1s
  payloadEncoding: raw
- action: wait
  duration: 10s
- action: stop-all
